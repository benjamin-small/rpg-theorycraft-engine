name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index, and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo run -p rtce --example guide_01_one_number
        run: cargo run -p rtce --example guide_01_one_number
      - name: cargo run -p rtce --example guide_02_buckets_and_folds
        run: cargo run -p rtce --example guide_02_buckets_and_folds
      - name: cargo run -p rtce --example guide_03_events_and_branches
        run: cargo run -p rtce --example guide_03_events_and_branches
      - name: cargo run -p rtce --example guide_04_conditions_and_scenarios
        run: cargo run -p rtce --example guide_04_conditions_and_scenarios
      - name: cargo run -p rtce --example guide_05_a_rotation
        run: cargo run -p rtce --example guide_05_a_rotation
      - name: cargo run -p rtce --example guide_06_buffs_and_uptime
        run: cargo run -p rtce --example guide_06_buffs_and_uptime
      - name: cargo run -p rtce --example guide_07_monte_carlo
        run: cargo run -p rtce --example guide_07_monte_carlo
      - name: cargo run -p rtce --example diablo4_basics
        run: cargo run -p rtce --example diablo4_basics
      - name: cargo run -p rtce --example diablo4_rotation
        run: cargo run -p rtce --example diablo4_rotation
      - name: cargo run -p rtce --example poe2_charges
        run: cargo run -p rtce --example poe2_charges
      - name: cargo run -p rtce --example poe2_poison
        run: cargo run -p rtce --example poe2_poison
      - name: cargo run -p rtce --example poe2_triggers
        run: cargo run -p rtce --example poe2_triggers
      - name: cargo run -p rtce --example poe2_ignite
        run: cargo run -p rtce --example poe2_ignite

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --all --check
        run: cargo fmt --all --check
