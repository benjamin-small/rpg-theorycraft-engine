[package]
name = "rtce"
version = "0.1.0"
edition = "2021"
description = "RPG theorycraft engine: game algorithms as configuration, compiled once into fast evaluation plans."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rtce-testkit = { path = "../rtce-testkit" }
serde_json = "1"
